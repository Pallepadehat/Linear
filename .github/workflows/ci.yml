name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Steps are skipped until the monorepo is scaffolded (M1-01).
      - uses: oven-sh/setup-bun@v2
        if: hashFiles('package.json') != ''

      - name: Install
        if: hashFiles('package.json') != ''
        run: bun install --frozen-lockfile

      - name: Lint
        if: hashFiles('package.json') != ''
        run: bun run lint

      - name: Typecheck
        if: hashFiles('package.json') != ''
        run: bun run typecheck

      - name: Test
        if: hashFiles('package.json') != ''
        run: bun run test

      - name: Build
        if: hashFiles('package.json') != ''
        run: bun run build
