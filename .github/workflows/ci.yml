name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    # Integration tests run against real Postgres and Redis (docs/testing.md).
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: linear
          POSTGRES_PASSWORD: linear
          POSTGRES_DB: linear
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U linear -d linear"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://linear:linear@localhost:5432/linear
      TEST_DATABASE_URL: postgres://linear:linear@localhost:5432/linear_test
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Format
        run: bun run format:check

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    # PRD §12 Test 10 in a real browser; apps/app/e2e/stack.ts starts api, worker and app.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: linear
          POSTGRES_PASSWORD: linear
          POSTGRES_DB: linear
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U linear -d linear"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://linear:linear@localhost:5432/linear
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install
        run: bun install --frozen-lockfile

      - name: Install Chromium
        working-directory: apps/app
        run: bunx playwright install --with-deps chromium

      - name: E2E
        run: bun run test:e2e

      - name: Upload Playwright report and traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/app/playwright-report/
            apps/app/test-results/
          retention-days: 7
