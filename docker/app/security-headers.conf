# Hardening headers for the SPA (OWASP A05). Included by every location that sets its own
# add_header, because nginx drops server-level add_header directives in such a location.
# The API sets its own (stricter) headers in apps/api/src/plugins/security-headers.ts.
#
# CSP: scripts only from our own origin (no inline scripts, no eval), so injected markup can't
# run. Styles allow 'unsafe-inline' for Vue style bindings, KaTeX and Mermaid. Images, media and
# uploads (connect-src) talk to the S3 endpoint, whose public URL is deploy-specific.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: http: https:; media-src 'self' blob: http: https:; font-src 'self' data:; connect-src 'self' ws: wss: http: https:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
