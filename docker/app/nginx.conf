# Serves the SPA and proxies the API on the same origin, like the Vite dev proxy,
# so Better Auth cookies stay first-party.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # Uploads go straight to object storage with presigned URLs; this only covers JSON bodies.
  client_max_body_size 2m;

  location ~ ^/(api|rpc|webhooks)/ {
    proxy_pass http://api:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
  }

  # Realtime WebSocket (oRPC over ws). The API pings every 25 s, inside the read timeout.
  location = /rpc/ws {
    proxy_pass http://api:3000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_read_timeout 1h;
  }

  location = /health {
    proxy_pass http://api:3000;
  }

  # Hashed build output never changes.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # History-mode routes fall back to the app shell, which must never be cached stale.
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }
}
