# Local infrastructure. Host ports are overridable (e.g. POSTGRES_PORT=5433) when
# another project already uses the defaults; update the URLs in .env to match.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: linear
      POSTGRES_PASSWORD: linear
      POSTGRES_DB: linear
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U linear -d linear']
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes', '--maxmemory-policy', 'noeviction']
    ports:
      - '${REDIS_PORT:-6379}:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - redis-data:/data

  # S3-compatible object storage. MinIO no longer publishes images, so we run
  # RustFS (see docs/decisions/0008). The code only speaks the S3 API.
  storage:
    image: rustfs/rustfs:1.0.4
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY:-linear}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY:-linear-storage-secret}
      RUSTFS_CONSOLE_ENABLE: 'true'
      RUSTFS_VOLUMES: /data
    ports:
      - '${STORAGE_PORT:-9000}:9000'
      - '${STORAGE_CONSOLE_PORT:-9001}:9001'
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://localhost:9000/health']
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - storage-data:/data

  # One-shot: creates the private bucket and allows browser PUTs from the app. Safe to re-run.
  storage-init:
    image: amazon/aws-cli:2.27.0
    depends_on:
      storage:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-linear}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:-linear-storage-secret}
      AWS_DEFAULT_REGION: ${S3_REGION:-us-east-1}
      BUCKET: ${S3_BUCKET:-linear-uploads}
      APP_URL: ${APP_URL:-http://localhost:5173}
    entrypoint: ['/bin/sh', '-c']
    command:
      - |
        set -e
        s3="aws --endpoint-url http://storage:9000 s3api"
        $$s3 head-bucket --bucket "$$BUCKET" 2>/dev/null || $$s3 create-bucket --bucket "$$BUCKET"
        $$s3 put-bucket-cors --bucket "$$BUCKET" --cors-configuration \
          "{\"CORSRules\":[{\"AllowedOrigins\":[\"$$APP_URL\"],\"AllowedMethods\":[\"GET\",\"PUT\"],\"AllowedHeaders\":[\"*\"],\"MaxAgeSeconds\":3000}]}" \
          || echo "bucket CORS not supported by this server; relying on its defaults"
        echo "bucket ready: $$BUCKET"
    restart: 'no'

volumes:
  postgres-data:
  redis-data:
  storage-data:
